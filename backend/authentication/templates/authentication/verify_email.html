{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4 text-center">
        <h3>Подтверждение почты</h3>
        <p>Код отправлен на вашу почту</p>
        <form method="post" class="card p-4">
            {% csrf_token %}
            <input type="text" name="code" class="form-control mb-3 text-center" placeholder="000000" required>
            <button class="btn btn-success w-100">Подтвердить</button>
        </form>
    </div>
</div>
{% endblock %}
