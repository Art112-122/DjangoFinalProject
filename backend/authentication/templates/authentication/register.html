{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0">
                <div class="card-body p-5">
                    <h2 class="text-center fw-bold mb-4">Регистрация</h2>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Никнейм (отображаемое имя)</label>
                            <input type="text" name="username" class="form-control" placeholder="Например: Ivan_Ivanov" required>
                            <div class="form-text">Ваш никнейм будет виден другим пользователям.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Пароль</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Создать аккаунт</button>
                        </div>
                    </form>
                </div>
            </div>
            {% for message in messages %}
                <div class="alert mt-2 {% if message.tags == 'error' %}alert-danger{% else %}alert-info{% endif %} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
        </div>
        
    </div>
</div>
{% endblock %}
