{% extends 'base.html' %}
{% load static %} {% block content %}
<div class="container mt-5">
    <div class="row"> <div class="col-md-5">
            <div class="card shadow-sm border-0 text-start"> <div class="card-body p-4">
                    
                    <div class="mb-4">
                        {% if user.avatar and user.avatar.url %}
                            <img src="{{ user.avatar.url }}" class="rounded-circle shadow-sm" 
                                 style="width: 120px; height: 120px; object-fit: cover; border: 2px solid #dee2e6;">
                        {% else %}
                            <img src="{% static 'images/defalt_avatar.png' %}" class="rounded-circle shadow-sm" 
                                 style="width: 120px; height: 120px; object-fit: cover; border: 2px solid #dee2e6;">
                        {% endif %}
                    </div>

                    <h3 class="fw-bold mb-1">{{ user.username }}</h3>
                    <p class="text-muted mb-4">{{ user.email }}</p>

                    <hr>

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase text-secondary">Изменить никнейм</label>
                            <input type="text" name="username" class="form-control" value="{{ user.username }}">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-uppercase text-secondary">Загрузить новое фото</label>
                            <input type="file" name="avatar" class="form-control" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-primary px-4">Сохранить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
